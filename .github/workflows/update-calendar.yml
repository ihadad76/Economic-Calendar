name: Update economic calendar
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,13,21 * * *"
  push:
    branches: [main]
    paths:
      - calendar_builder.py
      - requirements.txt
      - .github/workflows/update-calendar.yml
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test Fed chair speech recognition
        run: python test_fed_speeches.py
      - name: Build calendar from FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python calendar_builder.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          if ! git diff --cached --quiet; then
            git commit -m "Refresh economic calendar"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload calendar website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy calendar website
        id: deployment
        uses: actions/deploy-pages@v4
